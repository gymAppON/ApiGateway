server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
                    - id: oauth2_login
                      uri: http://localhost:8090
                      predicates:
                      - Path=/login/oauth2/**

                    - id: oauth2_login2
                      uri: http://localhost:8090
                      predicates:
                        - Path=/oauth2/**

                    - id: userManager_users
                      uri: http://localhost:8090
                      predicates:
                        - Path=/users/**
                      filters:
                        - AuthenticationFilter

                    - id: userManager_auth
                      uri: http://localhost:8090
                      predicates:
                        - Path=/auth/**