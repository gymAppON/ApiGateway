server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            #OAuth2 routes
            - id: oauth2_login
              uri: http://localhost:8090
              predicates:
                - Path=/login/oauth2/**
              filters:
                - AddRequestHeader=x-internal-api-key, ${USER_MANAGER_API_KEY}

            - id: oauth2_login2
              uri: http://localhost:8090
              predicates:
                - Path=/oauth2/**
              filters:
                - AddRequestHeader=x-internal-api-key, ${USER_MANAGER_API_KEY}

            #User Manager routes
            - id: userManager_users
              uri: http://localhost:8090
              predicates:
                - Path=/users/**
              filters:
                - AddRequestHeader=x-internal-api-key, ${USER_MANAGER_API_KEY}
                - AuthenticationFilter

            - id: userManager_auth
              uri: http://localhost:8090
              predicates:
                - Path=/auth/**
              filters:
                - AddRequestHeader=x-internal-api-key, ${USER_MANAGER_API_KEY}

              #Workout Manager routes
            - id: workoutManager_exercises
              uri: http://localhost:8070
              predicates:
                - Path=/exercises/**
              filters:
                - AddRequestHeader=x-internal-api-key, ${WORKOUT_MANAGER_API_KEY}
                - AuthenticationFilter
          default-filters:
            - TokenRelay
            - SaveSession